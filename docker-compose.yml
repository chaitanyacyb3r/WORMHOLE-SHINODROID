# ══════════════════════════════════════════════════════════════════════════════
# Shinodroid 忍ドロイド — Docker Compose (Production)
#
# Usage:
#   docker compose -f docker-compose.yml up -d   # Start all services
#   docker compose logs -f worker                # Watch worker logs
#   docker compose down                          # Stop all services
#
# Services:
#   web    — Next.js dashboard        (http://localhost:3000)
#   worker — Scan engine orchestrator  (background)
#   mobsf  — MobSF static analysis    (internal only)
#   ollama — LLM inference engine     (internal only)
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in your keys
#   2. Docker Desktop running
#   3. That's it.
# ══════════════════════════════════════════════════════════════════════════════

services:
  # ── Web Dashboard ─────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: Shinodroid-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - Shinodroid
    # Security: drop all capabilities, no privilege escalation
    security_opt:
      - no-new-privileges:true

  # ── Scan Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: Shinodroid-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Point MobSF to the sidecar container (not localhost)
      - MOBSF_URL=http://mobsf:8000
      # Point Ollama to the sidecar container (not localhost)
      - OLLAMA_URL=http://ollama:11434
      - REPORTS_OUTPUT_DIR=/app/reports
      # Puppeteer / Chromium flags for containerized environment
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    volumes:
      # Persist scan reports between restarts
      - reports-data:/app/reports
      # Mount Convex config from web/ for the worker to read
      - ./web/.env.local:/app/web/.env.local:ro
    depends_on:
      mobsf:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - Shinodroid
    # Security: no privilege escalation
    security_opt:
      - no-new-privileges:true
    # Security: limit resources to prevent runaway scans
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  # ── MobSF (Static Analysis) ──────────────────────────────────────────────
  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: Shinodroid-mobsf
    restart: unless-stopped
    # No external ports — accessed only by worker via internal network
    # Uncomment below for debugging:
    # ports:
    #   - "8000:8000"
    environment:
      - MOBSF_API_ONLY=1
      - MOBSF_API_KEY=${MOBSF_API_KEY}
    volumes:
      # Persist MobSF data (uploads, analysis cache) between restarts
      - mobsf-data:/home/mobsf/.MobSF
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8000)); s.close()"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 5
    networks:
      - Shinodroid
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"

  # ── Ollama (AI Triage Engine) ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: Shinodroid-ollama
    restart: unless-stopped
    # No external ports — accessed only by worker via internal network
    # Uncomment below for debugging:
    # ports:
    #   - "11434:11434"
    volumes:
      # Persist downloaded models between restarts
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      - Shinodroid
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"

networks:
  Shinodroid:
    driver: bridge
    name: Shinodroid-net

volumes:
  reports-data:
    name: Shinodroid-reports
  mobsf-data:
    name: Shinodroid-mobsf
  ollama-data:
    name: Shinodroid-ollama
