# ══════════════════════════════════════════════════════════════════════════════
# ShinobiDroid 忍ドロイド — Docker Compose (Production)
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f worker # Watch worker logs
#   docker compose down           # Stop all services
#
# Services:
#   web    — Next.js dashboard        (http://localhost:3000)
#   worker — Scan engine orchestrator  (background)
#   mobsf  — MobSF static analysis    (http://localhost:8000)
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in your Supabase keys
#   2. Docker Desktop running
#   3. That's it.
# ══════════════════════════════════════════════════════════════════════════════

services:
  # ── Web Dashboard ─────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: shinobidroid-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - shinobidroid
    # Security: read-only root filesystem where possible
    read_only: true
    tmpfs:
      - /tmp:size=64M
    # Security: drop all capabilities, no privilege escalation
    security_opt:
      - no-new-privileges:true

  # ── Scan Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: shinobidroid-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Point MobSF to the sidecar container (not localhost)
      - MOBSF_URL=http://mobsf:8000
      - REPORTS_OUTPUT_DIR=/app/reports
      # Puppeteer / Chromium flags for containerized environment
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    volumes:
      # Persist scan reports between restarts
      - reports-data:/app/reports
    depends_on:
      - mobsf
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - shinobidroid
    # Security: no privilege escalation
    security_opt:
      - no-new-privileges:true
    # Security: limit resources to prevent runaway scans
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  # ── MobSF (Static Analysis) ──────────────────────────────────────────────
  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: shinobidroid-mobsf
    restart: unless-stopped
    ports:
      # Expose MobSF UI for debugging (optional — remove in production)
      - "8000:8000"
    environment:
      - MOBSF_API_ONLY=1
    volumes:
      # Persist MobSF data (uploads, analysis cache) between restarts
      - mobsf-data:/home/mobsf/.MobSF
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 5
    networks:
      - shinobidroid
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"

networks:
  shinobidroid:
    driver: bridge
    name: shinobidroid-net

volumes:
  reports-data:
    name: shinobidroid-reports
  mobsf-data:
    name: shinobidroid-mobsf
